# Use with the upstream compose file. Only the web origin is exposed, on loopback.
name: muqiao-intel
services:
  setup:
    image: muqiao-intel-aihot:local
  api:
    image: muqiao-intel-aihot:local
    environment:
      UPSTREAM_REVIEW_CACHE: /upstream-reader/snapshot.json
    volumes:
      - /opt/intelligence-hub/aihot/private-reader-api:/upstream-reader:ro
  worker:
    image: muqiao-intel-aihot:local
    environment:
      ANALYZE_CONCURRENCY: '1'
  web:
    image: muqiao-intel-aihot:local
    ports: !override
      - '127.0.0.1:8088:3000'
